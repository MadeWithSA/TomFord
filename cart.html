<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TomFord — Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem('tf_theme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-page="cart">

<main class="page"><section class="section">
  <div class="head"><h1 data-i18n="cart_title"></h1></div>
  <div class="cart-wrap">
    <div id="cartList"></div>
    <aside class="side">
      <div id="cartSum"></div>
      <form class="form" id="orderForm" novalidate>
        <h3 data-i18n="checkout"></h3>
        <input name="name" data-i18n-ph="f_name" autocomplete="name">
        <input name="phone" type="tel" data-i18n-ph="f_phone" placeholder="+998" autocomplete="tel">
        <input name="address" data-i18n-ph="f_addr" autocomplete="street-address">
        <textarea name="comment" data-i18n-ph="f_comment"></textarea>
        <button class="btn" type="submit" data-i18n="send_order"></button>
        <div class="msg" id="orderMsg"></div>
      </form>
      <div class="msg" id="orderMsgOuter"></div>
    </aside>
  </div>
</section></main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
