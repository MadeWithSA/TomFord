<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TomFord — Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem('tf_theme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-page="catalog">

<main class="page"><section class="section">
  <div class="head"><h1 data-i18n="cat_title"></h1><p data-i18n="cat_sub"></p></div>
  <div class="toolbar">
    <div class="search"><input id="q" type="search" data-i18n-ph="search"></div>
    <div class="chips" id="chips">
      <button class="on" data-g="all" data-i18n="f_all"></button>
      <button data-g="men" data-i18n="f_men"></button>
      <button data-g="women" data-i18n="f_women"></button>
      <button data-g="unisex" data-i18n="f_unisex"></button>
    </div>
    <select id="sort"></select>
  </div>
  <div class="grid" id="grid"></div>
</section></main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
